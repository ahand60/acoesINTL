        - >-
          <strong>Idiomas e capacitação</strong> — A página institucional de 2024 registrou oportunidades de capacitação de servidores no Canadá, por meio do ILSC Education Group, e o acesso de estudantes e servidores à plataforma Altíssia, divulgado pelos Editais 339/2023 e 340/2023.
      links:
        - texto: Consulte o registro histórico
