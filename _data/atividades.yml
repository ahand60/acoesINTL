      paragrafos:
        - >-
          <strong>Programa PEC-G</strong> — O campus Guarulhos aderiu ao Programa PEC-G (Programa de Estudantes-Convênio de Graduação). Recebemos o estudante Sicer Manuel Maquengo Vaz Bandeira, de São Tomé e Príncipe, no curso de Engenharia de Controle e Automação. Iniciamos com o PEC-G em 2023.
      links:
        - texto: Consulte o registro histórico
          url: documentos/historico-internacionalizacao-2021-2024.html

