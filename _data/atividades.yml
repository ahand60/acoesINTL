- ano: 2026
  atividades:
    - data: Setembro de 2026
      paragrafos:
        - >-
          <strong>Campus Guarulhos no COBENGE 2026</strong> — Entre 14 e 17 de setembro, o campus esteve representado no Congresso Brasileiro de Educação em Engenharia, realizado na PUC Minas, em Belo Horizonte. Participaram presencialmente os estudantes Breno Cordeiro Doimo e Gustavo Araújo e o professor Dr. Marcelo Kenji Shibuya. Foram apresentados trabalhos sobre a missão internacional com a Pascual Bravo e sobre um simulador solar articulado de baixo custo.
      links:
        - texto: Notícia no IFSP Guarulhos
          url: https://gru.ifsp.edu.br/component/content/article/17-ultimas-noticias/2439-campus-guarulhos-marca-presen%C3%A7a-no-cobenge-2026-em-belo-horizonte.html
          externo: true
        - texto: Detalhes dos trabalhos
          url: documentos/cobenge-2026.html
        - texto: Anais publicado
          url: https://abenge.org.br/publicacao/2026/?id=451
          externo: true
        - texto: Fotos no Flickr
          url: https://www.flickr.com/photos/204466937@N07/albums/72177720336734997/with/55630871392
          externo: true

    - data: Maio de 2026
      paragrafos:
        - >-
          <strong>Relato de experiência com o pessoal da Pascual Bravo na XV Semana da Matemática </strong> — O artigo MISSÃO INTERNACIONAL BRASIL–COLÔMBIA IFSP – CAMPUS GUARULHOS E INSTITUCIÓN UNIVERSITARIA PASCUAL BRAVO “DE MEDELLÍN AO BRASIL CONHECIMENTO QUE TRANSCENDE FRONTEIRAS” foi apresentado na XV Semana da Matemática e essa participação foi registrada em álbum de fotos e vídeos no Flickr.
      links:
        - texto: Fotos e vídeos no Flickr
          url: https://www.flickr.com/photos/204466937@N07/albums/72177720333559449/
          externo: true
        - texto: Artigo publicado
          url: https://revista.gru.ifsp.edu.br/semat/article/view/419

    - data: "2026"
      paragrafos:
        - >-
          <strong>Mobilidade Internacional para Argentina</strong> — Estudantes de cursos técnicos integrados ao ensino médio foram selecionados ao programa de mobilidade para a Argentina (via ARINTER Edital N°8/2026 e edital local). Entre os estudantes selecionados tivemos dois estudantes do campus Guarulhos. <strong> Pelo PEC-G </strong> recebemos os seguintes alunos: Vanesio Nicandro Té (Guiné-Bissau) - Engenharia de Computação, Francisco Adão Segunda (Angola) - Análise e Desenvolvimento de Sistemas, Laumene Elizabeth da Fonseca (Angola) - Engenharia de Computação, Kennedy Kangethe Nganga (Quênia) - Análise e Desenvolvimento de Sistemas.

