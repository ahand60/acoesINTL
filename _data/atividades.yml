    - data: "2025"
      paragrafos:
        - >-
          <strong>Mobilidade Internacional para Chile</strong> — Estudantes de cursos técnicos integrados ao ensino médio foram selecionados ao programa de mobilidade para o Chile (via ARINTER Edital N°32/2025 e edital local Edital N°25/2025). Entre os estudantes selecionados tivemos três estudantes do campus Guarulhos. <strong> Pelo PEC-G </strong> recebemos o aluno Francisco Adão Segunda (Angola) - Análise e Desenvolvimento de Sistemas.

- ano: 2024
  atividades:
    - data: "2024"
      paragrafos:
        - >-
          <strong>Mobilidade internacional para Portugal</strong> — Onze estudantes de cursos técnicos integrados ao ensino médio foram selecionados pelo Edital 52/2024 para participar de um programa de mobilidade em instituições parceiras na cidade do Porto. Entre os estudantes selecionados tivemos uma estudante do campus Guarulhos.
        - >-
          <strong>Aproximação entre pesquisadores do IFSP e da Institución Universitaria Pascual Bravo</strong> — Foram levantados interesses de pesquisa, formados grupos temáticos e realizadas reuniões virtuais.
      links:
        - texto: Histórico de 2021 a 2024
          url: documentos/historico-internacionalizacao-2021-2024.html

