- ano: "2022"
  atividades:
    - data: "2022"
      paragrafos:
        - "<strong>Institución Universitaria Pascual Bravo</strong> — País: Colômbia."
        - "<strong>Objetivo:</strong> Conhecer a infraestrutura técnico-científica do IFSP – Campus Guarulhos, especialmente os laboratórios especializados, como o Laboratório 4.0, o Laboratório Maker e o Laboratório de Energias Renováveis, explorando suas possibilidades de utilização em atividades formativas e projetos colaborativos; delinear metas e estratégias para ações conjuntas, identificando oportunidades de cooperação em ensino, pesquisa e inovação."
        - "<strong>Resultados:</strong> A iniciativa gerou resultados concretos e houve avanço nas negociações."
