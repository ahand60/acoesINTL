# Depoimentos (as aspas são adicionadas pelo template).

- texto: A Institución Universitaria Pascual Bravo, tem uma grande sinergia com o IFSP, temos realizado valiosa troca de experiências de pesquisa e educacionais, que unem estudantes e docentes.
  autor: Prof. Dr. Wilson Carlos da Silva Junior
  foto: img/wilson0.png
  foto_alt: Prof. Dr. Wilson Carlos da Silva Junior
- texto: A sala de aula se torna um espaço multicultural, desenvolvendo a consciência global de cada um.
  autor: Profa. Ms. Elizabete Rubliauskas Giachetti
  foto: img/bete0.png
  foto_alt: Profa. Ms. Elizabete Rubliauskas Giachetti
- texto: A troca de experiências e conhecimentos entre instituições de diversos paises sempre foi um pilar para o desenvolvimento da pesquisa.
  autor: Prof. Dr. Dennis Lozano Toufen
  foto: img/denis0.png
  foto_alt: Prof. Dr. Dennis Lozano Toufen
- texto: Receber os alunos, alunas, professores e professoras da Universidade Pascual Bravo foi uma experiência bastante proveitosa, pois foi possível abrir o horizonte das nossas pesquisas. Os nossos alunos ficaram maravilhados com o intercâmbio de saberes com a visita recebida!
  autor: Prof. Dr. Marcelo Kenji Shibuya
  foto: img/shibu0.png
  foto_alt: Prof. Dr. Marcelo Kenji Shibuya
- texto: A ação em conjunto com a Pascual Bravo teve um impacto significativo na vida acadêmica de todos os participantes.
  autor: Maria Eduarda Alves Selvatti - Engenharia da Computação
  foto: img/duda.png
  foto_alt: Maria Eduarda Alves Selvatti
